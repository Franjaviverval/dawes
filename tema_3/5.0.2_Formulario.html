      <h1 class="mb-4">Registro</h1>
      <div class="row w-50 gx-5 border border-light rounded-3 p-4">
        <div class="col-md-6">
          <div class="mb-3">
            <label for="input-name" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="input-name" name="name">
          </div>
          <div class="mb-3">
            <label for="input-lastname" class="form-label">Apellidos</label>
            <input type="text" class="form-control" id="input-lastname" name="lastname">
          </div>
          <div class="mb-3">
            <label for="input-email" class="form-label">Email</label>
            <input type="email" class="form-control" id="input-email" name="email">
          </div>
          <div class="mb-3">
            <label for="input-url" class="form-label">URL Página personal</label>
            <input type="url" class="form-control" id="input-url" name="url">
          </div>
          <div class="mb-3">
            <label for="input-roomates" class="form-label"> Número de convivientes</label>
            <input type="number" class="form-control" id="input-roomates" name="roomates">
          </div>
        </div>
        <div class="col-md-6">
          <div class="mb-4 text-center">
            <label class="form-label d-block">Sexo</label>
            <div class="d-flex justify-content-center gap-4">
              <div class="form-check">
                <input type="radio" class="form-check-input" id="input-man" name="genre" value="hombre">
                <label class="form-check-label" for="input-man">Hombre</label>
              </div>
              <div class="form-check">
                <input type="radio" class="form-check-input" id="input-woman" name="genre" value="mujer">
                <label class="form-check-label" for="input-woman">Mujer</label>
              </div>
            </div>
          </div>
          <div class="mb-4 text-center">
            <label class="form-label">Aficiones</label>
            <div class="d-flex flex-wrap gap-3">
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="aficion-deporte" name="aficiones[]" value="deporte">
                <label class="form-check-label" for="aficion-deporte">Deporte</label>
              </div>
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="aficion-musica" name="aficiones[]" value="musica">
                <label class="form-check-label" for="aficion-musica">Música</label>
              </div>
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="aficion-cine" name="aficiones[]" value="cine">

              </div>
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="aficion-videojuegos" name="aficiones[]"

                <label class="form-check-label" for="aficion-videojuegos">Videojuegos</label>
              </div>

          </div>

            <label for="input-menu" class="form-label">Menú favorito</label>
            <select class="form-select" id="input-menu" name="menu[]" multiple>

              <option value="hamburguesa">Hamburguesa</option>
              <option value="pasta">Pasta</option>
              <option value="ensalada">Ensalada</option>

          <div class="col-12 mb-3">

          </div>
